server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset      utf-8;
    absolute_redirect off;      # keep redirects on the Tailscale host:port

    # Directory URLs (/services/, /legal/terms/) resolve to their index.html;
    # anything else falls through to the 404 page.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # This is a preview of a company that does not exist yet — keep it out of
    # any crawler that finds its way onto the tailnet.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    gzip              on;
    gzip_types        text/plain text/css text/xml application/javascript image/svg+xml;
    gzip_min_length   1024;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
